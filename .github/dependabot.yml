version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /hostd
    schedule:
      interval: weekly
    labels: [dependencies, rust]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
