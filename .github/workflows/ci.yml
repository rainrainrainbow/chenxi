name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'

jobs:
  verify:
    name: 护栏 + Go/Rust 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # 零第三方依赖，没有 go.sum；开启 cache 反而会因找不到依赖文件失败。
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: 架构护栏（零依赖 / 无 cgo / 禁用本地推理）
        run: bash scripts/check-guardrails.sh

      - name: Go vet + 单元测试
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Rust check + 单元测试
        run: |
          cd hostd
          cargo check --all-targets
          cargo test --all-targets

  build-arm64:
    name: 原生 arm64 编译产物
    needs: verify
    # GitHub 托管的 arm64 runner：直接在 aarch64 上原生编译，绕开
    # x86 → aarch64 交叉链接器 sysroot 的坑（Ubuntu 24.04 上 -lgcc_s 常缺失）。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: 编译（原生 aarch64，Go 静态 + Rust 零 crate）
        run: |
          set +e
          make build-local > /tmp/chenxi-build.log 2>&1
          rc=$?
          cat /tmp/chenxi-build.log
          if [ "$rc" -ne 0 ]; then
            echo "---- 错误尾部（同步写入 annotations）----"
            tail -60 /tmp/chenxi-build.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$rc"
          fi

      - name: 校验产物架构与体积
        run: bash scripts/verify-artifacts.sh

      - name: 构建摘要
        run: |
          {
            echo '## 晨曦 · linux/arm64 构建（GitHub 原生 arm64 runner）'
            echo ''
            echo '| 产物 | 大小 | Machine |'
            echo '| --- | --- | --- |'
            for f in dist/chenxi dist/chenxi-hostd; do
              printf '| `%s` | %s | %s |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(readelf -h "$f" | awk -F: '/Machine/ {gsub(/^ +/, "", $2); print $2}')"
            done
            echo ''
            echo 'Go 侧静态链接、Rust 侧动态链接系统 glibc；本地推理已禁用。'
            echo '部署方法见仓库 README 与 `deploy/armbian-tuning.md`。'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chenxi-linux-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
