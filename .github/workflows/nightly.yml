name: Nightly / 供应链

on:
  schedule:
    # 每周一 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.22'

jobs:
  audit:
    name: 护栏 / 竞态 / 漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: 架构护栏
        run: bash scripts/check-guardrails.sh

      - name: Go 竞态检测（宿主架构）
        run: go test ./... -race -count=1

      - name: Rust release 模式测试
        run: cd hostd && cargo test --release

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-native:
    name: 原生 arm64 编译复核（工具链漂移检测）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: 编译 + 校验
        run: |
          make build-local
          bash scripts/verify-artifacts.sh
